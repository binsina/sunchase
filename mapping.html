        <style>
            /* Prevent vertical scrolling */
            html, body {
                overflow-y: hidden;
                height: 100vh;
                margin: 0;
                padding: 0;
            }
            
            /* Background image */
            .main {
                background-image: url('images/beach.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
            }
            
            /* Glass effect for logo text */
            .logo {
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 25px;
                padding: 20px 40px;
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
                display: block;
                margin: 0 auto 30px auto;
                text-align: center;
                width: fit-content;
            }
            
            /* Glass Navigation Bar Styles */
            .navbar-glass {
                background: rgba(0, 0, 0, 0.3) !important;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            }
            
                    .navbar-glass .navbar-brand {
                color: white !important;
                font-weight: bold;
                font-size: 20px;
                padding: 8px 0 8px 15px;
                margin-left: 0;
            }
            
            .navbar-glass .navbar-nav > li > a {
                color: white !important;
                font-weight: 500;
                transition: all 0.3s ease;
                padding: 8px 20px;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 20px;
                margin: 4px 2px;
                display: flex;
                align-items: center;
                height: 100%;
            }
            
            .navbar-glass .navbar-nav > li > a:hover {
                background: rgba(255, 255, 255, 0.2) !important;
                color: #1e90ff !important;
                transform: translateY(-2px);
                border-color: rgba(255, 255, 255, 0.4);
            }
            
            .navbar-glass .btn-signin {
                background: rgba(255, 255, 255, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 25px;
                padding: 6px 16px !important;
                margin: 4px 0;
                transition: all 0.3s ease;
            }
            
            .navbar-glass .btn-signin:hover {
                background: rgba(255, 255, 255, 0.3) !important;
                border-color: rgba(255, 255, 255, 0.5);
                transform: translateY(-2px);
            }
            
            .navbar-glass .btn-register {
                background: rgba(30, 144, 255, 0.2);
                border: 1px solid rgba(30, 144, 255, 0.3);
                border-radius: 25px;
                padding: 6px 16px !important;
                margin: 4px 0;
                transition: all 0.3s ease;
            }
            
            .navbar-glass .btn-register:hover {
                background: rgba(30, 144, 255, 0.3) !important;
                border-color: rgba(30, 144, 255, 0.5);
                transform: translateY(-2px);
            }
            
            .navbar-glass .navbar-toggle {
                border-color: rgba(255, 255, 255, 0.5);
            }
            
            .navbar-glass .navbar-toggle .icon-bar {
                background-color: white;
            }
            
            .navbar-glass .navbar-toggle:hover {
                background-color: rgba(255, 255, 255, 0.1);
            }
            
            /* Mobile responsive adjustments */
            @media (max-width: 768px) {
                .navbar-glass .navbar-nav > li > a {
                    padding: 6px 15px;
                }
                
                .navbar-glass .btn-signin {
                    margin: 3px 15px;
                    text-align: center;
                }
                
                .navbar-glass .btn-register {
                    margin: 3px 15px;
                    text-align: center;
                }
            }
            
            /* Ensure navbar brand starts from far left */
            .navbar-glass .container {
                padding-left: 0;
            }
            
            .navbar-glass .navbar-header {
                margin-left: 0;
            }
            
            /* Center navigation items vertically */
            .navbar-glass .navbar-nav {
                display: flex;
                align-items: center;
            }
            
            .navbar-glass .navbar-nav > li {
                display: flex;
                align-items: center;
                margin-top: 10px;
                margin-right: 15px;
            }
            
            /* Dropdown styling */
            .navbar-glass .dropdown-menu {
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 10px;
                margin-top: 5px;
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            }
            
            .navbar-glass .dropdown-menu > li > a {
                color: white !important;
                background: transparent;
                border: none;
                border-radius: 0;
                margin: 0;
                padding: 8px 20px;
                transition: all 0.3s ease;
            }
            
            .navbar-glass .dropdown-menu > li > a:hover {
                background: rgba(255, 255, 255, 0.1) !important;
                color: #1e90ff !important;
                transform: translateX(5px);
            }
            
            .navbar-glass .caret {
                margin-left: 5px;
            }
        </style>
      
    </head>
