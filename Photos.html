   <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
   
   <script type="text/javascript">
   $(document).ready(function() {
       // Array of all background images
       var images = [
            'images/2.png',
            'images/4.png',
            'images/5.png',
            'images/6.png',
            'images/7.png',
            'images/8.png',
            'images/9.png',
            'images/10.png',
           'images/11.png'
        ];
        
        // Generate slides dynamically
        var $swiperWrapper = $('.swiper-wrapper');
        images.forEach(function(image) {
            $swiperWrapper.append('<div class="swiper-slide" style="background-image: url(' + image + '); background-size: cover; background-position: center; background-repeat: no-repeat;"></div>');
        });
        
        // Initialize Swiper
        var swiper = new Swiper('.swiper-container', {
           effect: 'fade',
            loop: true,
            autoplay: {
                delay: 1000,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            on: {
                slideChange: function () {
                    // Update background of main container
                    var currentSlide = this.slides[this.activeIndex];
                    var backgroundImage = $(currentSlide).css('background-image');
                    $('#background-carousel').css('background-image', backgroundImage);
                }
            }
        });
        
        // Keyboard navigation
        $(document).keydown(function(e) {
            switch(e.keyCode) {
                case 37: // Left arrow
                    swiper.slidePrev();
                    break;
                case 39: // Right arrow
                    swiper.slideNext();
                    break;
                case 32: // Spacebar
                    e.preventDefault();
                    if (swiper.autoplay.running) {
                        swiper.autoplay.stop();
                    } else {
                        swiper.autoplay.start();
                    }
                    break;
            }
        });
    });
    </script>
